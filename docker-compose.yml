services:
  postgres:
    image: postgres:16-alpine
    container_name: timbernest-db
    environment:
      POSTGRES_DB: timbernest
      POSTGRES_USER: timbernest
      POSTGRES_PASSWORD: timbernest
    ports:
      - "5435:5432"
    volumes:
      - timbernest_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timbernest -d timbernest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  timbernest_pg:
